<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intelligence · Elite Club</title>
<meta name="description" content="AI automation, AI integration and AI agent development.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/logo.jpg">
<style>
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

:root { color-scheme: dark; --bg: #08090a; --fg: #f7f8f8; --muted: #8a8f98; --line: #23252a; --accent: #7a9bb5; }
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg);
  font: 400 1rem/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
header, main { width: 100%; max-width: 40rem; margin: 0 auto; padding-inline: 1.5rem; }
header { padding-top: 1.5rem; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.home { display: inline-flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .9rem; text-decoration: none; }
.home:hover { color: var(--fg); }
.home img { border-radius: 50%; }

main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-block: 4rem; }
h1 { font-size: clamp(2.5rem, 9vw, 4rem); font-weight: 600; letter-spacing: -.04em; line-height: 1; }
ul { list-style: none; padding: 0; margin-block: 2.5rem 3rem; }
li { padding-block: 1.1rem; border-top: 1px solid var(--line); font-size: 1.25rem; letter-spacing: -.01em; }
li:last-child { border-bottom: 1px solid var(--line); }

.cta { align-self: flex-start; padding: .8rem 1.25rem; border-radius: .5rem; background: var(--fg); color: var(--bg); font-weight: 500; text-decoration: none; }
.cta:hover { opacity: .88; }
.qr { width: 9rem; height: 9rem; margin-top: 2rem; border-radius: .75rem; }
@media (max-width: 40rem) { .qr { display: none; } }

/* Headline: letters fade and rise, 5-frame stagger at 30fps (1/6s). The line beneath types in once it finishes. */
.l { display: inline-block; animation: rise .42s cubic-bezier(.2, .8, .2, 1) calc(var(--i) * 1s / 6) both; }
@keyframes rise { from { opacity: 0; transform: translateY(.5em); } }
.typed { margin-top: 1rem; color: var(--muted); animation: type .55s steps(25) 2.25s both; }
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
@media (prefers-reduced-motion: reduce) { .l, .typed { animation: none; } }
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Elite Club Intelligence",
  "makesOffer": [
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Automation" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Integration" } },
    { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI Agent Development" } }
  ],
  "contactPoint": { "@type": "ContactPoint", "contactType": "sales", "url": "https://wa.me/message/KOT4E55P6S3VF1" }
}
</script>
</head>
<body>
<header>
  <a class="home" href="index.html"><img src="assets/logo.jpg" alt="" width="28" height="28">Elite Club</a>
</header>
<main>
  <h1>Intelligence</h1>
  <script>
    const h = document.querySelector('h1'), t = h.textContent;
    h.setAttribute('aria-label', t);
    h.innerHTML = [...t].map((c, i) => `<span class="l" style="--i:${i}" aria-hidden="true">${c}</span>`).join('');
  </script>
  <p class="typed">100+ businesses automated</p>
  <ul>
    <li>AI Automation</li>
    <li>AI Integration</li>
    <li>AI Agent Development</li>
  </ul>
  <a class="cta" href="https://wa.me/message/KOT4E55P6S3VF1">Message on WhatsApp</a>
  <img class="qr" src="assets/whatsapp-qr.jpg" alt="WhatsApp QR code" width="144" height="144">
</main>
</body>
</html>
